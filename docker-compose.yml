services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: httpsms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d httpsms"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 5s

  redis:
    image: redis:latest
    command: redis-server
    volumes:
      - redis:/var/lib/redis
    restart: on-failure

  api:
    build:
      context: ./api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure
    environment:
      SERVICE_FQDN_API_8000:
      ENV: local
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      USE_HTTP_LOGGER: "true"
      ENTITLEMENT_ENABLED: "false"
      EVENTS_QUEUE_TYPE: emulator
      EVENTS_QUEUE_NAME: events-local
      EVENTS_QUEUE_ENDPOINT: http://localhost:8000/v1/events
      EVENTS_QUEUE_USER_API_KEY: ${EVENTS_QUEUE_USER_API_KEY}
      EVENTS_QUEUE_USER_ID: ${EVENTS_QUEUE_USER_ID}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS}
      SMTP_FROM_NAME: httpSMS
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      APP_URL: ${SERVICE_URL_WEB_3000}
      APP_NAME: httpSMS
      APP_PORT: 8000
      SWAGGER_HOST: ${SERVICE_FQDN_API_8000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/httpsms
      DATABASE_URL_DEDICATED: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/httpsms
      REDIS_URL: redis://@redis:6379
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      AXIOM_TOKEN: ${AXIOM_TOKEN}
      AXIOM_DATASET_EVENTS: ${AXIOM_DATASET_EVENTS}
      AXIOM_DATASET_METRICS: ${AXIOM_DATASET_METRICS}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY}

  web:
    build:
      context: ./web
      args:
        API_BASE_URL: ${SERVICE_URL_API_8000}
        APP_URL: ${SERVICE_URL_WEB_3000}
        APP_NAME: httpSMS
        APP_GITHUB_URL: https://github.com/NdoleStudio/httpsms
        APP_DOCUMENTATION_URL: https://docs.httpsms.com
        APP_DOWNLOAD_URL: https://github.com/NdoleStudio/httpsms/releases/latest/download/HttpSms.apk
        APP_ENV: production
        CLOUDFLARE_TURNSTILE_SITE_KEY: ${CLOUDFLARE_TURNSTILE_SITE_KEY}
        PUSHER_KEY: ${PUSHER_KEY}
        PUSHER_CLUSTER: ${PUSHER_CLUSTER}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID}
    depends_on:
      api:
        condition: service_started
    restart: on-failure
    environment:
      SERVICE_FQDN_WEB_3000:

volumes:
  redis:
  postgres:
